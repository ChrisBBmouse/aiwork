name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows runner 的默认 stdout 不是 UTF-8，中文输出会抛 UnicodeEncodeError
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install every skill that declares a pyproject
        shell: bash
        run: |
          python -m pip install --upgrade pip
          for f in skills/*/pyproject.toml; do
            [ -e "$f" ] || continue
            d=$(dirname "$f")
            echo "::group::install $d"
            pip install -e "$d"
            echo "::endgroup::"
          done

      - name: Run every skill's tests
        shell: bash
        run: |
          fail=0
          for t in skills/*/tests/run_tests.py; do
            [ -e "$t" ] || continue
            d=$(dirname "$(dirname "$t")")
            echo "::group::test $d"
            (cd "$d" && python tests/run_tests.py) || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Byte-compile all Python sources
        shell: bash
        run: |
          for d in skills/*/; do
            [ -d "$d" ] || continue
            python -m compileall -q "$d" || exit 1
          done
